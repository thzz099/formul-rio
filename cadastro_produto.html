<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 align="center">Cadastro de Produto</h1>
    <form>
        <p align="center"><label>Nome do Produto:</label></p>
        <p align="center"><input type="text"></p>

        <p align="center"><label>Descrição:</label></p>
        <p align="center"><textarea rows="4" cols="40"></textarea></p>

        <p align="center"><label>Unidade de Medida:</label></p>
        <p align="center"><select>
            <option>Unidade (un)</option>
            <option>Quilograma (kg)</option>
            <option>Grama (g)</option>
            <option>Litro (l)</option>
            <option>Mililitro (ml)</option>
            <option>Metro (m)</option>
            <option>Caixa (cx)</option>
            <option>Pacote (pct)</option>
        </select></p>

        <p align="center"><label>Quantidade:</label></p>
        <p align="center"><input type="number"></p>

        <p align="center"><label>Valor (R$):</label></p>
        <p align="center"><input type="number"></p>

        <p align="center"><button><a href="pagina_principal.html">Cadastrar</a></button></p>
    </form>
</body>
</html>
